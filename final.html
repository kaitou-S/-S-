<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070c">
<title>怪盗S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a24b;--gold-l:#ecd9a0;--red:#c23232;--paper:#f1e6c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070c;color-scheme:dark}
body{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;color:var(--paper);letter-spacing:.08em;-webkit-font-smoothing:antialiased;overflow:hidden}
#stage{position:fixed;inset:0}

/* 扉の奥の光 */
#light{position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 50%,rgba(255,244,214,.95),rgba(236,217,160,.5) 40%,rgba(14,19,32,0) 78%);opacity:0;transition:opacity 2.6s ease}
#light.on{opacity:1}

/* 扉の奥(正体と、サプライズ動画) */
#reveal{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;overflow-y:auto}
.rl{font-size:1.05rem;line-height:2.1;color:#fff;text-shadow:0 0 18px rgba(0,0,0,.7);opacity:0;transform:translateY(10px);transition:opacity 1.1s ease,transform 1.1s ease}
.rl.in{opacity:1;transform:none}
.rl.big{font-size:1.25rem;letter-spacing:.2em;color:#2b2418;text-shadow:none}
.rv-stage{position:relative;width:min(56vw,230px);aspect-ratio:1;opacity:0;transition:opacity 1.2s ease}
.rv-stage.in{opacity:1}
.rv-stage[hidden]{display:none}
.rv-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .6s ease .12s,transform .8s ease .12s,filter .6s ease .12s}
.rv-char{filter:drop-shadow(0 0 14px rgba(236,217,160,.7))}
.rv-true{opacity:0;transform:scale(.7);filter:drop-shadow(0 0 14px rgba(236,217,160,.7))}
.rv-stage.swap .rv-char{opacity:0;transform:scale(1.25);filter:brightness(3) blur(3px)}
.rv-stage.swap .rv-true{opacity:1;transform:scale(1)}
.rv-flash{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(236,217,160,.5) 35%,transparent 70%);opacity:0;pointer-events:none}
.rv-stage.swap .rv-flash{animation:flashPop 1.1s ease-out}
@keyframes flashPop{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.twink{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;animation:twink 1.1s ease-out forwards}
@keyframes twink{
  0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}
  30%{opacity:1;transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.5)) scale(1.3) rotate(90deg)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}
}
#videoBox{position:relative;opacity:0;transition:opacity 1.2s ease}
#videoBox.in{opacity:1}
#videoBox[hidden]{display:none}
#vid{display:block;width:min(92vw,520px);max-height:68vh;border-radius:8px;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#playBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 30px;border:1px solid var(--gold);background:rgba(5,7,12,.8);color:var(--gold-l);border-radius:40px;font:inherit;font-size:1rem;letter-spacing:.3em;cursor:pointer}
#playBtn[hidden]{display:none}
.novid{font-size:.8rem;color:#97a3b8}
#vload{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 18px;background:rgba(5,7,12,.78);border-radius:20px;font-size:.8rem;color:var(--gold-l);letter-spacing:.2em;pointer-events:none}
#vload[hidden]{display:none}

/* 扉(2枚) */
#door{position:absolute;inset:0;z-index:2;display:flex;perspective:1500px;pointer-events:none;overflow:hidden}
.leaf{position:relative;width:50%;height:100%;background:linear-gradient(180deg,#101728,#0a0f1c);box-shadow:inset 0 0 0 3px rgba(201,162,75,.55),inset 0 0 0 9px #0a0f1c,inset 0 0 0 10px rgba(201,162,75,.3);transition:transform 2.8s cubic-bezier(.5,0,.2,1)}
.leaf::after{content:"";position:absolute;inset:26px;border:1px solid rgba(201,162,75,.25);background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(201,162,75,.06) 22px 23px)}
.leaf.l{transform-origin:left center}
.leaf.r{transform-origin:right center}
#door.open .leaf.l{transform:rotateY(100deg)}
#door.open .leaf.r{transform:rotateY(-100deg)}

/* 手前の画面(怪盗Sの言葉と、暗号の入力) */
#ui{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center;transition:opacity 1s ease}
#ui.out{opacity:0;pointer-events:none}
.seal{width:84px;height:84px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b13a46,#8e2a35 55%,#6f1f29);font:700 1.9rem/1 "Shippori Mincho",serif;color:rgba(255,255,255,.78);box-shadow:0 6px 20px rgba(0,0,0,.6);animation:pulse 3s ease-in-out infinite}
.seal.img{background:none;box-shadow:none;border-radius:0;animation:none}
.seal.img img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 12px rgba(236,217,160,.6))}
@keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.6),0 0 0 0 rgba(194,50,50,.5)}50%{box-shadow:0 6px 20px rgba(0,0,0,.6),0 0 26px 6px rgba(194,50,50,.45)}}
.il{font-size:1.08rem;line-height:2.2;color:var(--paper);opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease}
.il.in{opacity:1;transform:none}
#form{width:100%;max-width:340px;margin-top:18px;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease}
#form.in{opacity:1;transform:none}
#form[hidden]{display:none}
.lock{display:block;width:70px;height:auto;margin:0 auto;filter:drop-shadow(0 0 14px rgba(201,162,75,.35))}
.shackle{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.keyhole{transition:fill .4s}
.lock.open .shackle{transform:translateY(-13px)}
.lock.open .keyhole{fill:#ecd9a0}
.lab{font-size:.7rem;letter-spacing:.4em;color:var(--gold-l)}
#code{width:100%;padding:14px 16px;font-size:1.1rem;text-align:center;letter-spacing:.2em;color:#fff;background:#0b101c;border:1px solid var(--gold);border-radius:10px;outline:none;font-family:inherit}
#code::placeholder{color:#4a566e}
#code:focus{box-shadow:0 0 0 3px rgba(201,162,75,.25)}
#go{padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#d9b559,#a98128);color:#1a1405;font:inherit;font-weight:700;font-size:.98rem;letter-spacing:.4em;cursor:pointer}
#form.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#msg{min-height:1.8em;font-size:.86rem;color:#f08a8a;letter-spacing:.1em}

@media (prefers-reduced-motion:reduce){
  .leaf,#light,.rl,.il,#form,.rv-stage,#videoBox,#ui{transition-duration:.01ms!important}
  .seal,.rv-stage.swap .rv-flash,.twink{animation:none!important}
}
</style>
</head>
<body>
<div id="stage">
  <div id="light"></div>

  <!-- 扉の奥: 正体と、サプライズ動画 -->
  <div id="reveal">
    <p class="rl" id="rl1"></p>
    <div class="rv-stage" id="rvStage" hidden>
      <img class="rv-char" id="rvChar" alt="" hidden>
      <img class="rv-true" id="rvTrue" alt="" hidden>
      <span class="rv-flash"></span>
    </div>
    <p class="rl" id="rlSign"></p>
    <p class="rl" id="rlMore"></p>
    <div id="videoBox" hidden>
      <video id="vid" playsinline preload="auto" controls></video>
      <button type="button" id="playBtn" hidden>▶　見る</button>
      <p id="vload" hidden>読み込み中…</p>
    </div>
  </div>

  <!-- 閉じた扉 -->
  <div id="door" aria-hidden="true"><div class="leaf l"></div><div class="leaf r"></div></div>

  <!-- 手前: 怪盗Sの言葉と、暗号の入力 -->
  <div id="ui">
    <div class="seal" id="seal">S</div>
    <div id="introLines"></div>
    <form id="form" autocomplete="off" hidden>
      <svg class="lock" id="lock" viewBox="0 0 80 96" aria-hidden="true">
        <path class="shackle" d="M22 44V30a18 18 0 0 1 36 0v14" fill="none" stroke="#c9a24b" stroke-width="7" stroke-linecap="round"/>
        <rect x="10" y="42" width="60" height="46" rx="8" fill="#151c2e" stroke="#c9a24b" stroke-width="3"/>
        <circle class="keyhole" cx="40" cy="62" r="6" fill="#c23232"/>
        <rect class="keyhole" x="37.5" y="64" width="5" height="13" rx="2" fill="#c23232"/>
      </svg>
      <label class="lab" for="code">暗　号</label>
      <input id="code" type="text" placeholder="ここに入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button id="go" type="submit">解錠</button>
    </form>
    <p id="msg" role="status" aria-live="polite"></p>
  </div>
</div>

<script>
(function(){
  /* =====================================================
     設定(ここを書き換えてください)
     ===================================================== */
  var INTRO_LINES=['……よくここまで、たどり着けたな。','これが、本当に、最後の謎だ。'];   // 最初に出る、怪盗Sの言葉
  var ANSWERS=['たちまちづき','立待月','0517'];                                    // 暗号の答え(いくつ書いてもOK。いまは、仮の答えです)
  var REVEAL_LINE='……私の正体は──';                                               // 扉が開いたあとの、一言
  var SIGN='怪盗S ── 〇〇より';                                                    // 正体のあとに出る署名(〇〇をあなたの名前に)
  var MORE_LINE='……そして、もうひとつ。';                                         // 動画の前の、一言
  var CHAR_SRC='kaitou.png';        // 怪盗Sの画像
  var TRUE_SRC='shunichi.png';      // 正体の画像(怪盗Sが、きらりと光って、これに変わる)
  var VIDEO_SRC='surprise.mp4';     // サプライズ動画のファイル(同じフォルダに置く)

  /* ===================================================== */
  var $=function(id){return document.getElementById(id);};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var T=function(ms){return reduce?0:ms;};
  var ui=$('ui'),door=$('door'),light=$('light'),form=$('form'),code=$('code'),msg=$('msg'),lock=$('lock'),seal=$('seal'),introLines=$('introLines');
  var rl1=$('rl1'),rvStage=$('rvStage'),rvChar=$('rvChar'),rvTrue=$('rvTrue'),rlSign=$('rlSign'),rlMore=$('rlMore'),videoBox=$('videoBox'),vid=$('vid'),playBtn=$('playBtn');
  var charOK=false,trueOK=false,busy=false,unlocked=false;

  /* ---------- 画像 ---------- */
  var ci=new Image();ci.onload=function(){charOK=true;rvChar.src=CHAR_SRC;rvChar.hidden=false;seal.textContent='';var im=new Image();im.src=CHAR_SRC;im.alt='';seal.appendChild(im);seal.classList.add('img');};ci.src=CHAR_SRC;
  var ti=new Image();ti.onload=function(){trueOK=true;rvTrue.src=TRUE_SRC;rvTrue.hidden=false;};ti.src=TRUE_SRC;

  /* ---------- 音(Web Audio。ファイル不要) ---------- */
  var AC=null;
  function audio(){
    try{
      if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}
      if(AC.state==='suspended'){AC.resume();}
    }catch(e){AC=null;}
    return AC;
  }
  function noise(ac,dur,freq,q,vol,t0,type){
    var len=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0),j;
    for(j=0;j<len;j++){d[j]=(Math.random()*2-1)*Math.pow(1-j/len,2);}
    var src=ac.createBufferSource();src.buffer=buf;
    var f=ac.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
    var g=ac.createGain();g.gain.value=vol;
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start(ac.currentTime+t0);
  }
  function tone(ac,freq,t0,dur,vol,type){
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.05);
  }
  // 鍵が、かちゃ、と開く音
  function unlockSound(){
    var ac=audio();if(!ac){return;}
    noise(ac,0.05,3800,2,0.55,0);tone(ac,1900,0,0.18,0.07);
    noise(ac,0.07,2400,1.6,0.6,0.16);tone(ac,1300,0.16,0.3,0.08);tone(ac,90,0.16,0.18,0.18);
  }
  // 重い扉が、ゆっくり開く音
  function doorSound(){
    var ac=audio();if(!ac){return;}
    var t=ac.currentTime,len=Math.floor(ac.sampleRate*2.8),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0),j;
    for(j=0;j<len;j++){d[j]=(Math.random()*2-1)*Math.sin(Math.PI*j/len);}
    var src=ac.createBufferSource();src.buffer=buf;
    var f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=3;
    f.frequency.setValueAtTime(240,t);f.frequency.exponentialRampToValueAtTime(90,t+2.6);
    var g=ac.createGain();g.gain.value=0.35;
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start(t);
    var o=ac.createOscillator(),og=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(48,t+2.6);
    og.gain.setValueAtTime(0.0001,t);og.gain.exponentialRampToValueAtTime(0.05,t+0.5);og.gain.exponentialRampToValueAtTime(0.0001,t+2.7);
    o.connect(og);og.connect(ac.destination);o.start(t);o.stop(t+2.8);
  }
  function buzz(){var ac=audio();if(!ac){return;}tone(ac,110,0,0.28,0.09,'sawtooth');tone(ac,98,0.1,0.3,0.07,'sawtooth');}
  function kirari(){var ac=audio();if(!ac){return;}tone(ac,1318.5,0,0.6,0.09);tone(ac,1568,0.09,0.6,0.08);tone(ac,2093,0.18,1.1,0.07);}
  function vib(ms){try{if(navigator.vibrate){navigator.vibrate(ms);}}catch(e){}}

  /* ---------- 合言葉の正規化 ---------- */
  function norm(s){
    s=(s||'');
    if(s.normalize){s=s.normalize('NFKC');}
    s=s.toLowerCase();
    s=s.replace(/[\u30a1-\u30f6]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});
    s=s.replace(/[\s.,\-_\/:;!?'"「」『』()・、。]/g,'');
    return s;
  }
  function correct(v){return ANSWERS.some(function(a){return norm(a)===v;});}

  /* ---------- 最初: 怪盗Sの言葉 → 暗号の入力 ---------- */
  INTRO_LINES.forEach(function(t,i){
    var p=document.createElement('p');p.className='il';p.textContent=t;introLines.appendChild(p);
    setTimeout(function(){p.classList.add('in');},T(700+i*1900));
  });
  setTimeout(function(){
    form.hidden=false;void form.offsetWidth;form.classList.add('in');
  },T(700+INTRO_LINES.length*1900+800));

  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(unlocked||busy){return;}
    var v=norm(code.value);
    if(!v){return;}
    audio();
    if(!correct(v)){
      msg.textContent='……違う。';
      form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
      buzz();vib(60);
      return;
    }
    unlocked=true;msg.textContent='';code.blur();
    run();
  });

  /* ---------- 解錠 → 扉が開く → 正体 → サプライズ動画 ---------- */
  function run(){
    lock.classList.add('open');
    unlockSound();vib(90);
    setTimeout(function(){ui.classList.add('out');},T(900));
    setTimeout(function(){
      doorSound();
      light.classList.add('on');
      door.classList.add('open');
    },T(1500));
    // 扉の奥で、一言 → 怪盗S → 正体
    setTimeout(function(){rl1.textContent=REVEAL_LINE;rl1.classList.add('in');},T(4300));
    setTimeout(function(){
      if(charOK||trueOK){rvStage.hidden=false;void rvStage.offsetWidth;rvStage.classList.add('in');}
      if(trueOK&&!charOK){rvStage.classList.add('swap');}
    },T(5800));
    setTimeout(function(){
      if(charOK&&trueOK){rvStage.classList.add('swap');sparkle();kirari();vib(120);}
    },T(8200));
    setTimeout(function(){rlSign.textContent=SIGN;rlSign.classList.add('in');},T(10200));
    setTimeout(function(){rlMore.textContent=MORE_LINE;rlMore.classList.add('in');},T(12400));
    setTimeout(showVideo,T(14200));
  }
  function sparkle(){
    var colors=['#ffffff','#ecd9a0','#c9a24b'];
    for(var j=0;j<18;j++){
      var s=document.createElement('i');s.className='twink';
      var a=(Math.PI*2*j/18)+Math.random()*.3,r=70+Math.random()*80;
      s.style.setProperty('--dx',Math.round(Math.cos(a)*r)+'px');
      s.style.setProperty('--dy',Math.round(Math.sin(a)*r)+'px');
      s.style.background=colors[j%3];
      s.style.animationDelay=(Math.random()*.15)+'s';
      rvStage.appendChild(s);
      (function(n){setTimeout(function(){if(n.parentNode){n.parentNode.removeChild(n);}},1400);})(s);
    }
  }

  /* ---------- サプライズ動画 ---------- */
  // ページを開いた直後から、裏で、動画の読み込みを始めておく(暗号を解いている間に、できるだけ、ためておく)
  var vidErr=false,vload=$('vload');
  vid.preload='auto';
  vid.addEventListener('error',function(){vidErr=true;});
  vid.src=VIDEO_SRC;
  try{vid.load();}catch(e){}
  vid.addEventListener('waiting',function(){vload.hidden=false;});          // 途中で、読み込みが追いつかないとき
  vid.addEventListener('playing',function(){vload.hidden=true;playBtn.hidden=true;});
  function startPlay(){
    var pr=null;
    try{pr=vid.play();}catch(e){}
    if(pr&&pr.catch){pr.catch(function(){vload.hidden=true;playBtn.hidden=false;});}  // 自動再生が許可されないとき
  }
  function showVideo(){
    videoBox.hidden=false;void videoBox.offsetWidth;videoBox.classList.add('in');
    if(vidErr){videoBox.innerHTML='<p class="novid">(動画ファイル '+VIDEO_SRC+' が見つかりません)</p>';return;}
    if(vid.readyState>=3){startPlay();return;}   // もう、再生できるだけ読み込めていれば、すぐ始める
    vload.hidden=false;
    var started=false;
    function go(){if(started){return;}started=true;vload.hidden=true;startPlay();}
    vid.addEventListener('canplay',go,{once:true});
    setTimeout(go,10000);   // 10秒たっても、準備ができないときは、そのまま、再生を試す
  }
  playBtn.addEventListener('click',function(){playBtn.hidden=true;startPlay();});
})();
</script>
</body>
</html>
